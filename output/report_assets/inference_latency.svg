<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title">
<title id="title">Frozen model inference latency</title>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="70" y="62" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" text-anchor="start" fill="#222222">Frozen model inference latency</text>
<text x="70" y="100" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#555555">Median end-to-end time for a 2,894-record batch</text>
<line x1="430.0" y1="150" x2="430.0" y2="760" stroke="#E2E2E2" stroke-width="2"/>
<text x="430.0" y="800" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#555555">0</text>
<line x1="616.0" y1="150" x2="616.0" y2="760" stroke="#E2E2E2" stroke-width="2"/>
<text x="616.0" y="800" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#555555">250</text>
<line x1="802.0" y1="150" x2="802.0" y2="760" stroke="#E2E2E2" stroke-width="2"/>
<text x="802.0" y="800" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#555555">500</text>
<line x1="988.0" y1="150" x2="988.0" y2="760" stroke="#E2E2E2" stroke-width="2"/>
<text x="988.0" y="800" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#555555">750</text>
<line x1="1174.0" y1="150" x2="1174.0" y2="760" stroke="#E2E2E2" stroke-width="2"/>
<text x="1174.0" y="800" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#555555">1000</text>
<line x1="1360.0" y1="150" x2="1360.0" y2="760" stroke="#E2E2E2" stroke-width="2"/>
<text x="1360.0" y="800" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#555555">1250</text>
<text x="405" y="210" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="end" fill="#222222">A  Logistic regression</text>
<rect x="430" y="185" width="23.6" height="42" rx="4" fill="#0072B2"/>
<text x="468.6" y="214" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#222222">31.7 ms</text>
<text x="405" y="306" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="end" fill="#222222">A  Linear SVM</text>
<rect x="430" y="281" width="24.1" height="42" rx="4" fill="#D55E00"/>
<text x="469.1" y="310" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#222222">32.4 ms</text>
<text x="405" y="402" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="end" fill="#222222">B  Logistic regression</text>
<rect x="430" y="377" width="46.3" height="42" rx="4" fill="#0072B2"/>
<text x="491.3" y="406" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#222222">62.2 ms</text>
<text x="405" y="498" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="end" fill="#222222">B  Linear SVM</text>
<rect x="430" y="473" width="46.5" height="42" rx="4" fill="#D55E00"/>
<text x="491.5" y="502" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#222222">62.5 ms</text>
<text x="405" y="594" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="end" fill="#222222">C  Logistic regression</text>
<rect x="430" y="569" width="902.1" height="42" rx="4" fill="#0072B2"/>
<text x="1347.1" y="598" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#222222">1212.4 ms</text>
<text x="405" y="690" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="end" fill="#222222">C  Linear SVM</text>
<rect x="430" y="665" width="884.5" height="42" rx="4" fill="#D55E00"/>
<text x="1329.5" y="694" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#222222">1188.8 ms</text>
<text x="895.0" y="855" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#222222">Milliseconds per complete test batch</text>
</svg>
